<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-Summarizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0B1120, #1E3A8A);
            color: #E5E7EB;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #111827;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            background: linear-gradient(90deg, #3B82F6, #60A5FA);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h3 {
            text-align: center;
            margin-top: -20px;
            margin-bottom: 40px;
            color: #9CA3AF;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .container p {
            color: #D1D5DB;
        }

        textarea {
            height: 150px;
            padding: 10px;
            border: 1px solid #374151;
            border-radius: 6px;
            font-size: 16px;

            background: #1F2937;
            color: #F9FAFB;
        }

        button {
            background: linear-gradient(90deg, #2563EB, #3B82F6);
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 6px;

            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(90deg, #1D4ED8, #2563EB);
        }

        #summary-output {
            margin-top: 20px;
            background: #1F2937;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #374151;
            color: #E5E7EB;
        }

        #summary-heading {
            margin-top: 0px;
            margin-bottom: 0px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TEXT SUMMARIZER</h1>
        <h3>HuggingFace Transformer</h3>
        <p> Write or Paste content below to generate summary !!</p>

        <form id="summarization-form">
            <textarea id="dialogue-input" placeholder="Enter your content...." required></textarea>
            <button type="submit">Summarize</button>
        </form>

        <div id="summary-output">
            <h3 id="summary-heading">Content Summary</h3>
            <p id="summary-text"></p>
        </div>
    </div>

    <script>
        document.getElementById("summarization-form").addEventListener("submit", async (e) => {
            e.preventDefault();
        
            const dialogueInput = document.getElementById("dialogue-input");
            const summaryText = document.getElementById("summary-text");
            const submitButton = e.target.querySelector("button");
        
            const dialogue = dialogueInput.value.trim();
            if (!dialogue) return;
        
            summaryText.innerText = "Processing...";
            submitButton.disabled = true;
        
            try {
                const response = await fetch("/summarize/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ dialogue }),
                });
        
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }
        
                const data = await response.json();
                summaryText.innerText = data.summary || "No summary returned.";
            } catch (err) {
                
                summaryText.innerText = `Error: ${err.message}`;
            } finally {
                
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
